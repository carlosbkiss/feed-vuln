name: radar

on:
  schedule:
    - cron: "17 11-23/2 * * *"   # 8h17 às 20h17 de SP (UTC-3), a cada 2h, todos os dias
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  verificar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar KEV e NVD
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python scripts/check_feeds.py

      - name: Gravar alertas (só se mudou)
        run: |
          if [ -n "$(git status --porcelain -- data/alertas.json)" ]; then
            git config user.name "radar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/alertas.json
            git commit -m "alertas: $(python -c "import json;print(json.load(open('data/status.json'))['novos_nesta_rodada'])") novo(s)"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "Sem alteração nos alertas."
          fi

      - name: Montar site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
