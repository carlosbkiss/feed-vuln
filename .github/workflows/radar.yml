name: radar

on:
  schedule:
    - cron: "17 11-23/2 * * *"   # 8h17 às 20h17 de SP (UTC-3), a cada 2h, todos os dias
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  coletar-e-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # sempre a versão mais recente (o run pode ter ficado na fila atrás de outro)

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # memória entre rodadas: artigos vistos, candidatos, saúde das fontes, log
      - name: Restaurar estado
        uses: actions/cache/restore@v4
        with:
          path: .estado
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Coletar, consolidar, enriquecer
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: python scripts/radar.py

      - name: Salvar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .estado
          key: estado-${{ github.run_id }}

      - name: Gravar radar e histórico (só se mudou)
        run: |
          if [ -n "$(git status --porcelain -- data/vulns.json data/historico)" ]; then
            git config user.name "radar-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/vulns.json data/historico
            N=$(python -c "import json;print(len(json.load(open('data/status.json'))['novos_nesta_rodada']))")
            git commit -m "radar: ${N} novo(s)"
            # em conflito nos arquivos gerados, vale o dado desta rodada
            git pull --rebase -X theirs origin main || { git rebase --abort; git pull --no-rebase -X ours origin main; }
            git push origin HEAD:main
          else
            echo "Sem alteração."
          fi

      - name: Montar site
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r data _site/data

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
